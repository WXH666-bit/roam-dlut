name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 必须在 prebuild / gradle 打包前注入：EXPO_PUBLIC_ 变量在编译期内联进 JS bundle
      EXPO_PUBLIC_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查后端地址变量（防打出指向 localhost 的废包）
        run: |
          if [ -z "$EXPO_PUBLIC_BACKEND_BASE_URL" ]; then
            echo "::error::未配置 BACKEND_BASE_URL 仓库变量！请到仓库 Settings → Secrets and variables → Actions → Variables 新建 BACKEND_BASE_URL（形如 http://<公网IP>:9091），再重新运行本 workflow。"
            exit 1
          fi
          echo "后端地址: $EXPO_PUBLIC_BACKEND_BASE_URL"

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖（pnpm workspace，含 patchedDependencies 补丁）
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 确认 Android SDK 可用
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3

      - name: Expo prebuild 生成 android 原生工程（CI 现场生成，不进 git）
        working-directory: client
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Gradle assembleRelease（Expo 模板 release 默认 debug keystore 签名，可直接安装）
        working-directory: client/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 整理 APK 文件名（带 run 编号）
        run: cp client/android/app/build/outputs/apk/release/app-release.apk "cidi-r${{ github.run_number }}.apk"

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cidi-apk-r${{ github.run_number }}
          path: cidi-r${{ github.run_number }}.apk
          retention-days: 30
