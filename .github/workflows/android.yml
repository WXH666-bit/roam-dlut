name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要 GITHUB_TOKEN 有写权限（默认只读会 403）

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 必须在 prebuild / gradle 打包前注入：EXPO_PUBLIC_ 变量在编译期内联进 JS bundle
      EXPO_PUBLIC_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
      # 可选；不设置时自动使用 BACKEND_BASE_URL/api/v1/updates/manifest
      EXPO_PUBLIC_OTA_UPDATE_URL: ${{ vars.OTA_UPDATE_URL }}
      # 只在 prebuild 时写入 AndroidManifest；在高德控制台绑定包名和签名 SHA-1。
      AMAP_ANDROID_API_KEY: ${{ secrets.AMAP_ANDROID_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查 Android 构建变量
        run: |
          if [ -z "$EXPO_PUBLIC_BACKEND_BASE_URL" ]; then
            echo "::error::未配置 BACKEND_BASE_URL 仓库变量！请到仓库 Settings → Secrets and variables → Actions → Variables 新建 BACKEND_BASE_URL（形如 http://<公网IP>:9091），再重新运行本 workflow。"
            exit 1
          fi
          if [ -z "$AMAP_ANDROID_API_KEY" ]; then
            echo "::error::未配置 AMAP_ANDROID_API_KEY 仓库 Secret！新版 APK 将无法启用高德主定位。"
            exit 1
          fi
          echo "后端地址: $EXPO_PUBLIC_BACKEND_BASE_URL"
          echo "高德 Android Key: 已配置"

      # pnpm/action-setup@v4 自动读取根 package.json 的 packageManager 字段（pnpm@9.0.0）
      # 不要再传 with.version，否则与 packageManager 冲突报 ERR_PNPM_BAD_PM_VERSION
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（pnpm workspace，含 patchedDependencies 补丁）
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 确认 Android SDK 可用
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3

      - name: Expo prebuild 生成 android 原生工程（CI 现场生成，不进 git）
        working-directory: client
        run: pnpm exec expo prebuild --platform android --no-install

      - name: 校验高德 Key 绑定的 APK 签名 SHA-1
        shell: bash
        run: |
          EXPECTED_SHA1='5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25'
          ACTUAL_SHA1="$(keytool -list -v \
            -keystore client/android/app/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::APK 签名 SHA-1 已变化。请重新绑定高德 Android Key，并同步更新 workflow 中的 EXPECTED_SHA1。"
            exit 1
          fi
          echo "OK: APK signing SHA-1=$ACTUAL_SHA1"

      - name: 校验明文流量配置已写入 AndroidManifest（withCleartextTraffic 插件生效）
        run: |
          MANIFEST=client/android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android:usesCleartextTraffic="true"' "$MANIFEST"; then
            echo "::error::$MANIFEST 缺少 android:usesCleartextTraffic=\"true\"，APK 访问 http 后端会被 Android 9+ 明文策略拦截！"
            echo "::error::原因：client/plugins/withCleartextTraffic.js 未生效（被删除，或未在 app.config.ts 的 plugins 数组注册）。"
            echo "::error::若后端已切 https，请同步删除该插件与本校验步骤。"
            exit 1
          fi
          echo "OK: $MANIFEST 已包含 usesCleartextTraffic=true"

      - name: 校验高德主定位、后台守候服务与权限已合并
        shell: bash
        run: |
          APP_MANIFEST=client/android/app/src/main/AndroidManifest.xml
          AMAP_MANIFEST=client/modules/amap-location/android/src/main/AndroidManifest.xml
          GUARDIAN_MANIFEST=client/modules/background-guardian/android/src/main/AndroidManifest.xml
          AUTOLINK_OUTPUT="$(client/node_modules/.bin/expo-modules-autolinking resolve --platform android --project-root client)"
          grep -Fq '@here/amap-location' <<<"$AUTOLINK_OUTPUT" || {
            echo "::error::高德定位原生模块未被 Expo autolinking 识别"; exit 1;
          }
          grep -Fq 'com.amap.api.location.APSService' "$AMAP_MANIFEST" || {
            echo "::error::高德 APSService 未声明"; exit 1;
          }
          grep -Fq 'com.amap.api.v2.apikey' "$APP_MANIFEST" || {
            echo "::error::高德 Android Key 未写入原生 Manifest"; exit 1;
          }
          grep -Fq '@cidi/background-guardian' <<<"$AUTOLINK_OUTPUT" || {
            echo "::error::BackgroundGuardian 原生模块未被 Expo autolinking 识别"; exit 1;
          }
          grep -Fq '.BackgroundGuardianService' "$GUARDIAN_MANIFEST" || {
            echo "::error::荣耀兼容的 BackgroundGuardianService 未声明"; exit 1;
          }
          grep -Fq 'android.permission.ACCESS_BACKGROUND_LOCATION' "$APP_MANIFEST" || {
            echo "::error::APK 缺少后台定位权限"; exit 1;
          }
          grep -Fq 'android.permission.FOREGROUND_SERVICE_LOCATION' "$APP_MANIFEST" || {
            echo "::error::APK 缺少 Android 14 定位前台服务权限"; exit 1;
          }
          grep -Fq 'android:foregroundServiceType="location"' "$GUARDIAN_MANIFEST" || {
            echo "::error::守候服务未声明 foregroundServiceType=location"; exit 1;
          }
          echo "OK: 高德主定位与 LocationManager 守候服务已 autolink，Key 和定位权限已写入原生工程"

      - name: 校验自托管热更新配置已写入 APK 原生工程
        shell: bash
        run: |
          MANIFEST=client/android/app/src/main/AndroidManifest.xml
          STRINGS=client/android/app/src/main/res/values/strings.xml
          EXPECTED_OTA_URL="${EXPO_PUBLIC_OTA_UPDATE_URL:-${EXPO_PUBLIC_BACKEND_BASE_URL%/}/api/v1/updates/manifest}"
          grep -Fq 'expo.modules.updates.ENABLED' "$MANIFEST" || {
            echo "::error::expo-updates 未启用"; exit 1;
          }
          grep -Fq "$EXPECTED_OTA_URL" "$MANIFEST" || {
            echo "::error::APK 中的 OTA 地址不是 $EXPECTED_OTA_URL"; exit 1;
          }
          grep -Fq 'expo.modules.updates.CODE_SIGNING_CERTIFICATE' "$MANIFEST" || {
            echo "::error::APK 未内置 OTA 验签证书"; exit 1;
          }
          grep -Fq 'expo.modules.updates.CODE_SIGNING_METADATA' "$MANIFEST" || {
            echo "::error::APK 未内置 OTA 验签元数据"; exit 1;
          }
          RUNTIME_VERSION="$(sed -n 's/.*<string name="expo_runtime_version">\([^<]*\)<\/string>.*/\1/p' "$STRINGS" | head -1)"
          if [ -z "$RUNTIME_VERSION" ]; then
            echo "::error::APK runtimeVersion 未正确生成"; exit 1
          fi
          echo "OK: 自托管 OTA=$EXPECTED_OTA_URL，runtimeVersion=$RUNTIME_VERSION，代码签名已启用"

      # expo-updates 的 Release KSP 编译会加载大量 Kotlin 元数据；Expo 模板默认的
      # Metaspace 上限在 GitHub Runner 上可能不够。统一放进 Gradle 进程并限制 worker，
      # 既提高 Metaspace 上限，也避免多个 JVM 并发把 Runner 内存耗尽。
      - name: 配置 Gradle/Kotlin 内存（避免 KSP Metaspace OOM）
        shell: bash
        run: |
          GRADLE_PROPERTIES=client/android/gradle.properties
          sed -i \
            -e '/^org\.gradle\.jvmargs=/d' \
            -e '/^kotlin\.compiler\.execution\.strategy=/d' \
            -e '/^org\.gradle\.workers\.max=/d' \
            "$GRADLE_PROPERTIES"
          printf '\n%s\n%s\n%s\n' \
            'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' \
            'kotlin.compiler.execution.strategy=in-process' \
            'org.gradle.workers.max=2' \
            >> "$GRADLE_PROPERTIES"
          grep -E '^(org\.gradle\.jvmargs|kotlin\.compiler\.execution\.strategy|org\.gradle\.workers\.max)=' "$GRADLE_PROPERTIES"

      - name: Gradle assembleRelease（Expo 模板 release 默认 debug keystore 签名，可直接安装）
        working-directory: client/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 整理 APK 文件名（带 run 编号）
        run: cp client/android/app/build/outputs/apk/release/app-release.apk "cidi-r${{ github.run_number }}.apk"

      - name: 上传 APK artifact（Actions 页面可下）
        uses: actions/upload-artifact@v4
        with:
          name: cidi-apk-r${{ github.run_number }}
          path: cidi-r${{ github.run_number }}.apk
          retention-days: 30

      # 构建成功后自动把 APK 挂到 latest Release：任何人不登录 GitHub 即可下载
      - name: 发布到 latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Here · 最新版 APK
          body: |
            main 分支最新自动构建（r${{ github.run_number }}）。

            **下载**：下方 Assets 中的 cidi-r${{ github.run_number }}.apk，直接安装即可。
            首次安装需允许"未知来源应用"。需要后端服务在线才能正常使用。
          files: cidi-r${{ github.run_number }}.apk
          make_latest: true
