name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 必须在 prebuild / gradle 打包前注入：EXPO_PUBLIC_ 变量在编译期内联进 JS bundle
      EXPO_PUBLIC_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查后端地址变量（防打出指向 localhost 的废包）
        run: |
          if [ -z "$EXPO_PUBLIC_BACKEND_BASE_URL" ]; then
            echo "::error::未配置 BACKEND_BASE_URL 仓库变量！请到仓库 Settings → Secrets and variables → Actions → Variables 新建 BACKEND_BASE_URL（形如 http://<公网IP>:9091），再重新运行本 workflow。"
            exit 1
          fi
          echo "后端地址: $EXPO_PUBLIC_BACKEND_BASE_URL"

      # pnpm/action-setup@v4 自动读取根 package.json 的 packageManager 字段（pnpm@9.0.0）
      # 不要再传 with.version，否则与 packageManager 冲突报 ERR_PNPM_BAD_PM_VERSION
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（pnpm workspace，含 patchedDependencies 补丁）
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 确认 Android SDK 可用
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3

      - name: Expo prebuild 生成 android 原生工程（CI 现场生成，不进 git）
        working-directory: client
        run: pnpm exec expo prebuild --platform android --no-install

      - name: 校验明文流量配置已写入 AndroidManifest（withCleartextTraffic 插件生效）
        run: |
          MANIFEST=client/android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android:usesCleartextTraffic="true"' "$MANIFEST"; then
            echo "::error::$MANIFEST 缺少 android:usesCleartextTraffic=\"true\"，APK 访问 http 后端会被 Android 9+ 明文策略拦截！"
            echo "::error::原因：client/plugins/withCleartextTraffic.js 未生效（被删除，或未在 app.config.ts 的 plugins 数组注册）。"
            echo "::error::若后端已切 https，请同步删除该插件与本校验步骤。"
            exit 1
          fi
          echo "OK: $MANIFEST 已包含 usesCleartextTraffic=true"

      - name: Gradle assembleRelease（Expo 模板 release 默认 debug keystore 签名，可直接安装）
        working-directory: client/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 整理 APK 文件名（带 run 编号）
        run: cp client/android/app/build/outputs/apk/release/app-release.apk "cidi-r${{ github.run_number }}.apk"

      - name: 上传 APK artifact（Actions 页面可下）
        uses: actions/upload-artifact@v4
        with:
          name: cidi-apk-r${{ github.run_number }}
          path: cidi-r${{ github.run_number }}.apk
          retention-days: 30

      # 构建成功后自动把 APK 挂到 latest Release：任何人不登录 GitHub 即可下载
      - name: 发布到 latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 此地有话 · 最新版 APK
          body: |
            main 分支最新自动构建（r${{ github.run_number }}）。

            **下载**：下方 Assets 中的 cidi-r${{ github.run_number }}.apk，直接安装即可。
            首次安装需允许"未知来源应用"。需要后端服务在线才能正常使用。
          files: cidi-r${{ github.run_number }}.apk
          make_latest: true
