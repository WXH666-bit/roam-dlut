plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.backgroundguardian'
version = '1.0.0'

android {
  namespace "expo.modules.backgroundguardian"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles("proguard-rules.pro")
  }
}
