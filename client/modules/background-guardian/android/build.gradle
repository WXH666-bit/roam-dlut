plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.backgroundguardian'
version = '1.0.0'

android {
  namespace "expo.modules.backgroundguardian"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles("proguard-rules.pro")
  }
}

dependencies {
  // The background guardian follows the same provider order as the foreground:
  // AMap first, Android framework providers only after a real AMap failure.
  implementation 'com.amap.api:location:11.2.100'
}
